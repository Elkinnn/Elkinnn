<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="194" viewBox="0 0 1200 194" fill="none" role="img" aria-labelledby="title"><title id="title">Let's build something meaningful. Contact Elkin López.</title><defs><linearGradient id="contact-bg" x2="1" y2=".6"><stop stop-color="#172e49"/><stop offset=".55" stop-color="#21455a"/><stop offset="1" stop-color="#1c5c5d"/></linearGradient></defs><style>
  .float{animation:float 6s ease-in-out infinite}.blink{animation:blink 6s infinite;transform-box:fill-box;transform-origin:center}.cursor{animation:cursor 1.6s steps(1) infinite}.scan{animation:scan 5s ease-in-out infinite}.dash{stroke-dasharray:5 9;animation:dash 18s linear infinite}
