<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" fill="none" role="img" aria-labelledby="title"><title id="title">Let's build something meaningful. Contact Elkin López.</title><defs><linearGradient id="contact-bg" x2="1" y2=".6"><stop stop-color="#172e49"/><stop offset=".55" stop-color="#21455a"/><stop offset="1" stop-color="#1c5c5d"/></linearGradient></defs><style>
